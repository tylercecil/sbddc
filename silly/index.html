<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>silly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css?family=Waiting+for+the+Sunrise" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Roughens edges so tiles look hand-drawn. Used by .tile::before in style.css;
       raise "scale" for wobblier lines. -->
  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <filter id="sketch">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="7" />
      <feDisplacementMap in="SourceGraphic" scale="4" />
    </filter>
  </svg>

  <nav id="nav">
    <button id="prev" aria-label="Previous page">&lsaquo;</button>
    <span id="nav-label"></span>
    <button id="next" aria-label="Next page">&rsaquo;</button>
  </nav>

  <!-- Pages, in order. data-puzzle="n" pages get PUZZLES[n-1] from game.js. -->
  <div id="viewport">
    <div id="pages">
      <section class="page text letter-page">
        <div class="letter">
          <h1>Hello!</h1>
          <p>There are four puzzles ahead. Each one hides a five-letter word.</p>
          <p>Type a guess and press Enter. Green means right letter, right spot.
             Yellow means right letter, wrong spot. Grey means not in the word.</p>
          <p>Guess as many times as you like.</p>
          <p>Swipe or use the arrows up top to move between pages.</p>
          <img class="letter-watermark" src="citizen.jpg" alt="">
        </div>
      </section>

      <section class="page" data-puzzle="1"></section>
      <section class="page" data-puzzle="2"></section>
      <section class="page" data-puzzle="3"></section>
      <section class="page" data-puzzle="4"></section>

      <section class="page text" id="answer">
        <form id="answer-form" autocomplete="off">
          <div id="answer-field">
            <input id="answer-input" type="text"
                   autocapitalize="characters" autocorrect="off" spellcheck="false"
                   enterkeyhint="go" data-keep-arrows aria-label="Your answer">
            <!-- Copy of the guess, one span per letter, shown while it's "checked". -->
            <div id="answer-letters" aria-hidden="true"></div>
          </div>
          <button type="submit">Go</button>
        </form>
        <p id="answer-message"></p>
      </section>
    </div>
  </div>

  <div id="toast"></div>

  <!-- Invisible input so phones open their keyboard. game.js keeps it focused. -->
  <input id="typer" type="text" maxlength="5"
         autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false"
         enterkeyhint="go" aria-label="Type your guess">

  <canvas id="confetti"></canvas>

  <script src="words.js"></script>
  <script src="game.js"></script>
  <script src="answer.js"></script>
  <script src="carousel.js"></script>
</body>
</html>
